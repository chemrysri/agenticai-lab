services:
  searxng:
    image: searxng/searxng:latest
    container_name: private-ai-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=private-ai-searxng
    restart: unless-stopped
